name: package
run-name: Attach signed Android v0.4.36 from verified build 40709409414
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  attach-signed-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested source and draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = rubyangxg/cc-desk-tunnel
          test "$(gh run view 40709409414 -R rubyangxg/cc-desk-tunnel --json conclusion,headSha --jq '[.conclusion,.headSha]|@tsv')" = "$(printf 'success\t81bc658feb411a772264ea2f3d14802bb7b1d435')"
          gh api repos/rubyangxg/cc-desk-tunnel/releases/426797589 > /tmp/cc-release.json
          node release-upload/verify.mjs
      - name: Attach signed APK and manifest to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.4.36 release-upload/CC-Desk-Tunnel-0.4.36-android.apk release-upload/release.json release-upload/SHA256SUMS -R rubyangxg/cc-desk-tunnel --clobber
