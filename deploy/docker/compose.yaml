services:
  proxy:
    image: ${PROXY_IMAGE:-cc-desk-tunnel:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      # Optional mirrors for building on the server, set in docker.env; empty uses the public sources.
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${CONTROL_BIND:-0.0.0.0}:${CONTROL_PORT:-8787}:8787"
    volumes:
      - "${DATA_DIR:?Run manage.sh init}:/data"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
